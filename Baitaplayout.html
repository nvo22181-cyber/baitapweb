<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Layout</title>
</head>

<body>

<table border="2" width="95%" align="center">

    <!-- HEADER -->
    <tr>
        <td colspan="3" height="200" bgcolor="red">

            <table border="2" width="100%" height="100%">

                <tr height="40">
                    <td>
                        THÔNG TIN CÔNG TY
                    </td>

                    <td align="center">
                        LOGO CÔNG TY
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        HEADER

                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Chào mừng đến với website
                    </td>
                </tr>

            </table>

        </td>

    <tr>

        </td>

    <!-- 3 CỘT -->
    <tr>

                <tr>
                    <td align="right">
                        Trang chủ
                    </td>
                </tr>

                <tr>
                    <td>
                        Thông tin tuyển sinh

                </tr>

                <tr>
                    <td>
                        Thông tin đào tạo
                    </td>
                </tr>

                <tr>
                    <td>
                        Liên hệ
                    </td>
                </tr>

            </table>

        </td>


        <!-- CONTENT -->
        <td width="60%" bgcolor="#B5C8F0" align="center" valign="middle">
            CONTENT
        </td>


        <!-- RIGHT MENU -->
        <td width="20%" bgcolor="yellow">
            Right Menu
        </td>

    </tr>


    <!-- PHẦN DƯỚI -->
    <tr>
        <td colspan="3" height="200" bgcolor="#D5DDF0" valign="top">

            <h2>một</h2>

            <h3>hai</h3>

            <p>ba</p>

            <p>Bốn</p>

        </td>
    </tr>

</table>

</html>
