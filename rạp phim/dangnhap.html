<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Nhập</title>
    
    <!-- CSS để tạo giao diện hiển thị ở giữa màn hình -->
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center; /* Căn giữa theo chiều ngang */
            align-items: center;     /* Căn giữa theo chiều dọc */
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .login-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .input-group input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .register-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .register-link a {
            color: #007bff;
            text-decoration: none;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Đăng Nhập</h2>
        
        <!-- Biểu mẫu đăng nhập -->
        <form action="#" method="POST">
            <div class="input-group">
                <label for="email">Tên đăng nhập hoặc Email:</label>
                <!-- Thuộc tính required bắt buộc người dùng phải điền -->
                <input type="text" id="email" name="email" placeholder="Nhập email của bạn" required>
            </div>
            
            <div class="input-group">
                <label for="password">Mật khẩu:</label>
                <!-- type="password" giúp mã hóa ký tự thành dấu chấm tròn -->
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
            </div>
            
            <button type="submit">Đăng nhập</button>
        </form>

        <!-- Nút chuyển hướng sang trang đăng ký theo câu hỏi trước của bạn -->
        <div class="register-link">
            Chưa có tài khoản? <a href="dang-ky.html">Đăng ký ngay</a>
        </div>
    </div>

</body>
</html>
